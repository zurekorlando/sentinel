name: Build Windows Agent

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'sentinel/ssm/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-agent:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller fastapi uvicorn[standard] anyio pydantic pywin32

      - name: Download NSSM from GitHub mirror
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $url = "https://github.com/nicholasgasior/nssm-mirror/releases/download/2.24/nssm-2.24.zip"
          $fallback = "https://www.nssm.cc/release/nssm-2.24.zip"
          try {
            Invoke-WebRequest -Uri $url -OutFile "dist/nssm.zip" -TimeoutSec 30
            Write-Host "Downloaded from mirror"
          } catch {
            Write-Host "Mirror failed, trying fallback..."
            Invoke-WebRequest -Uri $fallback -OutFile "dist/nssm.zip" -TimeoutSec 30
          }
          Expand-Archive -Path "dist/nssm.zip" -DestinationPath "dist/nssm_tmp" -Force
          Copy-Item "dist/nssm_tmp/nssm-2.24/win64/nssm.exe" "dist/nssm_win64.exe"
          Write-Host "NSSM ready: $((Get-Item dist/nssm_win64.exe).Length) bytes"

      - name: Build .exe with PyInstaller
        run: python agent/build.py

      - name: Build installer ZIP
        run: python agent/build_package.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAgent-Windows
          path: |
            dist/SentinelAgent.exe
            dist/SentinelAgent-installer.zip
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-build-${{ github.run_number }}
          name: "Sentinel Agent Build #${{ github.run_number }}"
          files: |
            dist/SentinelAgent.exe
            dist/SentinelAgent-installer.zip
