name: Build Windows Agent

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'sentinel/ssm/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-agent:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller fastapi uvicorn[standard] anyio pydantic pywin32

      - name: Download NSSM
        shell: powershell
        run: |
          mkdir -p dist
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile "dist/nssm.zip"
          Expand-Archive -Path "dist/nssm.zip" -DestinationPath "dist/nssm_tmp"
          Copy-Item "dist/nssm_tmp/nssm-2.24/win64/nssm.exe" "dist/nssm_win64.exe"

      - name: Build .exe with PyInstaller
        run: python agent/build.py

      - name: Build installer ZIP
        run: python agent/build_package.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAgent-Windows
          path: |
            dist/SentinelAgent.exe
            dist/SentinelAgent-installer.zip
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-build-${{ github.run_number }}
          name: "Sentinel Agent Build #${{ github.run_number }}"
          files: |
            dist/SentinelAgent.exe
            dist/SentinelAgent-installer.zip
          draft: false
          prerelease: false
