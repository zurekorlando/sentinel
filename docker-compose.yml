version: "3.8"

services:

  minio:
    image: quay.io/minio/minio:latest
    container_name: sentinel-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sentinel_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sentinel_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
      - /home/ozurek:/home/ozurek
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: sentinel-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-sentinel_admin} ${MINIO_ROOT_PASSWORD:-sentinel_password} &&
        mc mb --ignore-existing local/sentinel &&
        mc anonymous set none local/sentinel &&
        echo 'Bucket sentinel created.'
      "

  sentinel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-app
    depends_on:
      minio:
        condition: service_healthy
    environment:
      SENTINEL_PASSPHRASE: ${SENTINEL_PASSPHRASE}
    volumes:
      - .:/app
      - source_data:/data/source
      - catalog_data:/data/catalog
      - /home/ozurek:/home/ozurek
    entrypoint: []
    command: ["python", "-m", "sentinel.cli", "backup", "/app/jobs/example_job.json"]

  sentinel-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-api
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      SENTINEL_JOBS_DIR: "/app/jobs"
      SENTINEL_PASSPHRASE: ${SENTINEL_PASSPHRASE}
      SENTINEL_CORS_ORIGINS: "${SENTINEL_CORS_ORIGINS:-http://localhost:${WEB_PORT:-5173},http://192.168.1.87:${WEB_PORT:-5173}}"
    volumes:
      - .:/app
      - source_data:/data/source
      - catalog_data:/data/catalog
      - /home/ozurek:/home/ozurek
    entrypoint: []
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3

  sentinel-web:
    image: node:20-alpine
    container_name: sentinel-web
    working_dir: /app/web
    depends_on:
      sentinel-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_TARGET: "http://sentinel-api:8000"
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  minio_data:
  catalog_data:
  source_data:
