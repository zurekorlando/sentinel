[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-backup"
version = "0.1.0"
description = "Modular, storage-agnostic backup system with CDC, deduplication, and AES-256-GCM encryption."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "zstandard>=0.22.0",
    "boto3>=1.34.0",
    "click>=8.1.7",
    "requests>=2.31.0",
]

[project.scripts]
sentinel = "sentinel.cli:cli"

# -- Package discovery --------------------------------------------------------
# Setuptools detecta api/, web/, jobs/ y sentinel/ como candidatos y falla.
# Le indicamos que solo empaquete sentinel/ (y sus sub-paquetes).
[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not integration'"
asyncio_mode = "auto"           # pytest-asyncio: treat every async def as a test
markers = [
    "integration: requires external services (MinIO, Docker). Run with: pytest -m integration",
]

[tool.coverage.run]
source = ["sentinel"]
